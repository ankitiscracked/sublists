 assert(added.classList.contains('sf-list-item')&&!d.querySelector('.sf-stored-item'),'Late native post replaces placeholder immediately');
 assert(added.querySelector('img').getBoundingClientRect().width===36,'Native profile image stays visible');added.querySelector('button').click();assert(lateActions===1,'Late native action handler stays functional');
 await click('.sf-back');await input('Design');await click('.sf-folder-row');
 assert(added.classList.contains('sf-list-item')&&!d.querySelector('.sf-stored-item'),'Next visit adopts available native card');

 w.chrome.runtime.sendMessage=async request=>{if(request.action==='snapshot')snapshots++;return send(request);};

 // Routing stays readable, unambiguous and stable through app broadcasts/history.

 broadcast(routingLibrary);await tick();await input('Reading');
 await click('[data-folder-id="reading-1"]');const firstRoute=w.location.hash;
 await click('.sf-back');await click('[data-folder-id="reading-2"]');const secondRoute=w.location.hash;
 assert(firstRoute.startsWith('#list=reading-')&&secondRoute.startsWith('#list=reading-')&&firstRoute!==secondRoute,'Duplicate names have distinct stable readable routes');

 w.history.back();await tick();w.history.back();await tick();assert(w.location.hash===firstRoute&&d.querySelector('.sf-list-heading h2').textContent==='Reading','Back resolves original duplicate');
 w.history.forward();await tick();w.history.forward();await tick();assert(w.location.hash===secondRoute,'Forward resolves second duplicate');
 const renamed=routingLibrary.folders.find(f=>f.id==='reading-2');renamed.name='Books to read';broadcast(routingLibrary);await tick();
 assert(w.location.hash==='#list=books-to-read'&&d.querySelector('.sf-list-heading h2').textContent==='Books to read','Rename keeps selected ID and updates readable URL');
 await navigate(secondRoute);assert(w.location.hash==='#list=books-to-read','Old in-page route resolves renamed folder');
 await navigate('#sf-list='+encodeURIComponent('non-latin'));
 assert(decodeURIComponent(w.location.hash)==='#list=日本語-の本'&&d.querySelector('.sf-list-heading h2').textContent==='日本語 の本','Legacy ID migrates to encoded non-Latin name');
 await navigate('#sf-lists');assert(w.location.hash==='#lists'&&d.querySelector('.sf-lists-search'),'Legacy index migrates');
 await navigate('#list=not-a-real-list');assert(d.querySelector('.sf-library-status').textContent.includes('moved or deleted'),'Unknown readable list stays on missing-list state');
 await navigate('#list='+encodeURIComponent('日本語-の本'));assert(d.querySelector('.sf-list-heading h2').textContent==='日本語 の本','Encoded URL resolves without prior selection');
 assert(snapshots===routeRequests,'Route/history and data broadcasts do not request snapshots');
 broadcast(baseLibrary);await navigate('#lists');await input('');
 // A newly mounted document resolves a copied name link from its first snapshot.
 const reloadFrame=document.createElement('iframe');reloadFrame.hidden=true;
 await new Promise((resolve,reject)=>{reloadFrame.onload=resolve;reloadFrame.onerror=reject;reloadFrame.src='/preview/index.html?lists=1&v=10#list=design';document.body.append(reloadFrame);});
 await tick();assert(reloadFrame.contentDocument.querySelector('.sf-list-heading h2')?.textContent==='Design','Fresh page resolves copied readable link');reloadFrame.remove();
 // Long lists exercise both document scrolling and Substack-style inner scrollers.
 const library=await send({action:'snapshot'}),longPosts=[];
 for(let i=0;i<35;i++){
  const url=`https://example.substack.com/p/scroll-${i}`;longPosts.push({noteId:`scroll-${i}`,title:`Scroll item ${i}`,url,thumbnail:''});
  const article=d.createElement('article');article.style.minHeight='180px';article.innerHTML=`<a href="${url}"><h3>Scroll item ${i}</h3></a>`;
  d.querySelector('[aria-label="Saved items"]').append(article);
 }
 library.folders.push({id:'scroll',name:'Scroll testing',posts:longPosts});
 for(let i=0;i<35;i++)library.folders.push({id:`empty-${i}`,name:`ZZ list ${i}`,posts:[]});
 d.dispatchEvent(new CustomEvent('sf-library-changed',{detail:{snapshot:library}}));await tick();

 const lateUrl='https://example.substack.com/p/late-scroll';library.folders.find(f=>f.id==='scroll').posts.push({noteId:'late-scroll',title:'Late scroll item',url:lateUrl,thumbnail:''});
 d.dispatchEvent(new CustomEvent('sf-library-changed',{detail:{snapshot:structuredClone(library)}}));await tick();
 const lateCard=d.createElement('article');lateCard.style.minHeight='180px';lateCard.innerHTML=`<a href="${lateUrl}"><h3>Late scroll item</h3></a>`;d.querySelector('[aria-label="Saved items"]').prepend(lateCard);await tick();
 assert(lateCard.classList.contains('sf-list-item')&&!d.querySelector('.sf-stored-item'),'Scrolled list also adopts late native cards');

}catch(e){result.textContent='FAIL: '+e.message;throw e;}};
</script></html>
